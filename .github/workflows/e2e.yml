name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    name: E2E (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Behave on ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: 'true'
        run: |
          # run once; on a flaky failure, re-run only the failed scenarios
          behave -f allure_behave.formatter:AllureFormatter -o allure-results -f rerun -o rerun.txt -f pretty \
            || { echo "::warning::Re-running flaky scenarios"; behave @rerun.txt -f allure_behave.formatter:AllureFormatter -o allure-results -f pretty; }

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: ignore
