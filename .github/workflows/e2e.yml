name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    name: E2E (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Behave on ${{ matrix.browser }}
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: 'true'
        run: |
          # run once; on a flaky failure, re-run only the failed scenarios
          behave -f allure_behave.formatter:AllureFormatter -o allure-results -f rerun -o rerun.txt -f pretty \
            || { echo "::warning::Re-running flaky scenarios"; behave @rerun.txt -f allure_behave.formatter:AllureFormatter -o allure-results -f pretty; }

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: ignore

  report:
    name: Publish Allure report
    needs: e2e
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure results (all browsers)
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Load previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Publish report to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # the allure report action runs as root in Docker; reclaim ownership
          sudo chown -R "$(id -u):$(id -g)" allure-history
          cd allure-history
          git init -q
          git checkout -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Allure report for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
